<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encuéntranos frente al malecón">
  <title>Sabor del Pacífico</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>SABOR DEL PACÍFICO</h1>
    <nav>
      <a href="index.html">
        Inicio
      </a>
      <a href="menu.html">
        Menú
      </a>
      <a href="#contacto">
        Contacto
      </a>
    </nav>
  </header>
  <main id="contacto">
    <section>
      <h2>
        Encuéntranos
      </h2>
      <p>
        Calle 2 # 5-15, Centro, Buenaventura, frente al malecón
      </p>
    </section>
    <section>
      <form action="/formulario" method="post">
        <label for="nombre">
          Nombre completo: 
        </label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Pepito Arnoldo Pérez Barragán" required><br>
        <label for="correo">
          Correo: 
        </label>
        <input type="email" id="correo" name="correo" placeholder="Ej: tucorreo@email.com" required><br>
        <label for="telefono">
          Teléfono: 
        </label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej: 312 456 7890"><br>
        <label for="select">
          ¿Qué quieres? 
        </label>
        <select id="select" name="select" required>
          <option>
            Reservar mesa
          </option>
          <option>
            Pedir domicilio
          </option>
          <option>
            Preguntar por el menú
          </option>
        </select><br>
        <label for="mensaje">
          Mensaje: 
        </label>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40">Deja aquí tu mensaje...
        </textarea>
        <button type="submit">
          Enviar mensaje
        </button>
      </form><br><br>
      <img src="9f91dff1825ed5c5f459ff6438c217c8.jpeg"
      alt="Malecón del distrito de buenaventura"
      loading="lazy"
      width="400" height="200">
    </section>
  </main>
  <footer>
    <p>
      © 2026 Sabor del Pacífico - Buenaventura
    </p>
  </footer>
</body>

</html>
